<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB de Repaso 3.º DS «B»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070a1e;
      color: #f1f5f9;
      margin: 0;
      padding: 0 0 40px 0;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      color: #38bdf8;
      margin: 0 0 8px 0;
    }
    header p {
      color: #94a3b8;
      font-size: 1.05rem;
      margin: 0;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .titulo-seccion {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      color: #c084fc;
      font-size: 1.75rem;
      margin-top: 20px;
      margin-bottom: 6px;
    }
    .intro {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    #contenedor-modulos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
    }
    .tarjeta {
      background: #0d152d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      color: #f1f5f9;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>HUB 3.º DS «B»</h1>
    <p>Portal educativo de repaso integral - INDEL</p>
  </header>

  <main>
    <section class="wrap">
      <h2 class="titulo-seccion">Módulos del Año y Actividades</h2>
      <p class="intro">Listado ordenado por docente (Prof. Arcides Canales y Prof. Javier Mineros).</p>
      
      <div id="contenedor-modulos"></div>
    </section>
  </main>

  <!-- Enlace al script con type="module" -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
