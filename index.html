<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB de Repaso 3.º DS «B»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070a1e;
      color: #f1f5f9;
      margin: 0;
      padding: 0 0 40px 0;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      color: #38bdf8;
      margin: 0 0 8px 0;
    }
    header p {
      color: #94a3b8;
      font-size: 1.05rem;
      margin: 0;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .titulo-seccion {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      color: #c084fc;
      font-size: 1.75rem;
      margin-top: 20px;
      margin-bottom: 6px;
    }
    .intro {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    #contenedor-modulos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
      margin-top: 20px;
    }
    .tarjeta {
      background: #0d152d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      color: #f1f5f9;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>HUB 3.º DS «B»</h1>
    <p>Portal educativo de repaso integral - INDEL</p>
  </header>

  <main>
    <section class="wrap">
      <h2 class="titulo-seccion">Módulos del Año y Actividades</h2>
      <p class="intro">Listado ordenado por docente (Prof. Arcides Canales y Prof. Javier Mineros).</p>
      
      <div id="contenedor-modulos"></div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const modulosAnno = [
            // --- MÓDULOS DE PROF. ARCIDES CANALES ---
            {
                nombre: "BTVDS 3.1: Desarrollo de Aplicaciones para la Solución de Problemas",
                docente: "Prof. Arcides Canales",
                estado: "En curso",
                resumen: "Programación orientada a objetos, acceso a datos y ASP.NET Razor.",
                color: "#38bdf8",
                herramientas: ["C#", "ASP.NET Razor", "POO", "SQL"],
                ejercicios: [
                    "Práctica 1 y 2: POO Introducción, Herencia y Polimorfismo",
                    "Práctica 3 \"A\" Acceso a datos",
                    "Práctica 04 Creación de base de datos y conexión",
                    "Práctica 05 Code First - ASP Razor"
                ]
            },
            {
                nombre: "Módulo 3.3: Administración de Bases de Datos",
                docente: "Prof. Arcides Canales",
                estado: "Completado",
                resumen: "Consultas SQL avanzadas, dashboards y Power BI.",
                color: "#34d399",
                herramientas: ["SQL", "MySQL", "SQLite", "Power BI", "Excel"],
                ejercicios: [
                    "Prácticas SQL (Día 1, Día 2, Día 3 y Semana 4 con Access)",
                    "Consultas de BD (Semana 2 Query BD)",
                    "Actividades de Power BI y creación de Dashboards en Excel",
                    "Ejecución final y actividades remediales"
                ]
            },
            {
                nombre: "Módulo 3.2: Mantenimiento y Aseguramiento de Sistemas",
                docente: "Prof. Arcides Canales",
                estado: "Completado",
                resumen: "SLA, planes de contingencia y modelado UML.",
                color: "#c084fc",
                herramientas: ["Plantillas SLA", "UML", "Monitoreo"],
                ejercicios: [
                    "Modelado de software UML",
                    "Plantilla y aplicación de SLA",
                    "Semana 3: Monitoreo y registro de mantenimiento",
                    "Semana 6: Ejecución y planes de contingencia"
                ]
            },

            // --- MÓDULOS DE PROF. JAVIER MINEROS ---
            {
                nombre: "Módulo 3.8: Proyecto Innovador de Desarrollo de Software",
                docente: "Prof. Javier Mineros",
                estado: "En curso",
                resumen: "Aplicaciones multiplataforma y sistemas ERP con Python y Odoo.",
                color: "#f472b6",
                herramientas: ["Python", "Avalonia UI", "Flet", "Odoo", "Git"],
                ejercicios: [
                    "Guía Python Individual y apps con Python",
                    "Primer contacto con Avalonia UI y Flet",
                    "Odoo como sistema ERP",
                    "Avances de proyecto integrador (10% y 15%)"
                ]
            },
            {
                nombre: "Módulo 3.4: Elaboración de Documentación de Sistemas",
                docente: "Prof. Javier Mineros",
                estado: "Completado",
                resumen: "Arquitectura y manuales técnicos del software.",
                color: "#fbbf24",
                herramientas: ["UML", "Documentación", "Diagramas"],
                ejercicios: [
                    "Fase 1 a Fase 4: Desarrollo y arquitectura del software",
                    "Fase 5 y documentos finales del sistema",
                    "Fases 6 y 7 de pruebas y entrega",
                    "Manual de sistema y ejercicio final"
                ]
            },

            // --- OTROS MÓDULOS INSTITUCIONALES / INDEL ---
            {
                nombre: "Módulo 2: Desarrollo de Componentes para Dispositivos Móviles",
                docente: "INDEL",
                estado: "Completado",
                resumen: "Creación de interfaces y componentes para aplicaciones móviles.",
                color: "#ff7849",
                herramientas: [".NET MAUI", "C#", "XAML"],
                ejercicios: [
                    "Práctica 06 y Práctica 7 Net Maui",
                    "Práctica 8 y 9 Net Maui",
                    "Autoevaluación Práctica 9"
                ]
            },
            {
                nombre: "Módulo 3: Conversación de Inglés sobre Mantenimiento",
                docente: "INDEL",
                estado: "En curso",
                resumen: "Términos técnicos, metodologías ágiles y bases de datos en inglés.",
                color: "#2dd4bf",
                herramientas: ["Scrum", "CRUD", "IA"],
                ejercicios: [
                    "Práctica 10 Scrum",
                    "Práctica 11 - Base de datos CRUD-IA"
                ]
            },
            {
                nombre: "Módulo 4: Puesta en Marcha de la Empresa en Asociatividad Cooperativa",
                docente: "INDEL",
                estado: "Completado",
                resumen: "Proyectos de desarrollo empresarial, Winform, ASPX y Arduino.",
                color: "#fb7185",
                herramientas: ["Winform", "ASPX", "Arduino", "Prestashop", ".NET MAUI"],
                ejercicios: [
                    "Prestashop (Individual) 25% del módulo",
                    "Proyecto Final .net maui 25%",
                    "Proyecto Winform y aspx 25%",
                    "Proyecto Augustine-Arduino 25%"
                ]
            },
            {
                nombre: "Módulo 3.0: Orientación al Proceso Educativo",
                docente: "INDEL",
                estado: "Completado",
                resumen: "Lineamientos iniciales y organización de equipos.",
                color: "#a78bfa",
                herramientas: ["Portafolio", "Lineamientos", "Equipos"],
                ejercicios: [
                    "Creación de equipos de trabajo",
                    "Espacio para compartir códigos QR",
                    "Portafolio del Módulo 3.0"
                ]
            }
        ];

        const contenedor = document.getElementById("contenedor-modulos");
        if (!contenedor) return;

        contenedor.innerHTML = "";
        modulosAnno.forEach(modulo => {
            const tarjeta = document.createElement("div");
            tarjeta.className = "tarjeta";
            tarjeta.style.borderTop = `3px solid ${modulo.color}`;

            tarjeta.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px;">
                    <h3 style="color: ${modulo.color}; font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; margin: 0; line-height: 1.35; font-weight: 700;">${modulo.nombre}</h3>
                    <span style="background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap;">${modulo.estado}</span>
                </div>
                <p style="color: #94a3b8; font-size: 0.88rem; margin: 0 0 10px 0;">
                  <strong style="color: #cbd5e1;">Docente:</strong> ${modulo.docente}
                </p>
                <p style="color: #e2e8f0; font-size: 0.92rem; margin: 0 0 16px 0; line-height: 1.55;">${modulo.resumen}</p>
                
                <div style="background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
                    <span style="font-size: 0.75rem; color: ${modulo.color}; display: block; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Ejercicios y Tareas Clave</span>
                    <ul style="padding-left: 18px; margin: 0; font-size: 0.86rem; color: #cbd5e1; line-height: 1.6;">
                        ${modulo.ejercicios.map(ej => `<li>${ej}</li>`).join('')}
                    </ul>
                </div>

                <div style="border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 12px;">
                    <span style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 8px; font-weight: 600;">Herramientas:</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                        ${modulo.herramientas.map(h => `
                          <span style="background: rgba(255, 255, 255, 0.04); color: ${modulo.color}; padding: 3px 10px; border-radius: 8px; font-size: 0.78rem; border: 1px solid rgba(255, 255, 255, 0.08); font-weight: 500;">${h}</span>
                        `).join('')}
                    </div>
                </div>
            `;

            contenedor.appendChild(tarjeta);
